<svg width="380" height="380" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="avatarClip">
      <circle cx="190" cy="190" r="55"/>
    </clipPath>
  </defs>

  <!-- guide rings -->
  <circle cx="190" cy="190" r="150" fill="none" stroke="#3d3d3d" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="190" cy="190" r="150" fill="none" stroke="#8a9a7e" stroke-width="1" opacity="0.15"/>

  <!-- logo -->
  <circle cx="190" cy="190" r="58" fill="#1a1a1a" stroke="#8a9a7e" stroke-width="2"/>
  <image href="../favicon.svg" x="145" y="145" width="90" height="90" clip-path="url(#avatarClip)"/>

  <!-- orbiting icons: each icon = outer rotation (position around center) + inner counter-rotation (keeps icon upright) -->

  <!-- Python -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 190 190;360 190 190" dur="24s" begin="0s" repeatCount="indefinite"/>
    <g transform="translate(190,40)">
      <animateTransform attributeName="transform" type="rotate" values="0 0 150;-360 0 150" dur="24s" begin="0s" repeatCount="indefinite"/>
      <circle cx="0" cy="150" r="20" fill="#1a1a1a" stroke="#3d3d3d" stroke-width="1"/>
      <image href="https://cdn.simpleicons.org/python/8a9a7e" x="-13" y="137" width="26" height="26"/>
    </g>
  </g>

  <!-- C++ -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 190 190;360 190 190" dur="24s" begin="-4s" repeatCount="indefinite"/>
    <g transform="translate(190,40)">
      <animateTransform attributeName="transform" type="rotate" values="0 0 150;-360 0 150" dur="24s" begin="-4s" repeatCount="indefinite"/>
      <circle cx="0" cy="150" r="20" fill="#1a1a1a" stroke="#3d3d3d" stroke-width="1"/>
      <image href="https://cdn.simpleicons.org/cplusplus/8a9a7e" x="-13" y="137" width="26" height="26"/>
    </g>
  </g>

  <!-- JavaScript -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 190 190;360 190 190" dur="24s" begin="-8s" repeatCount="indefinite"/>
    <g transform="translate(190,40)">
      <animateTransform attributeName="transform" type="rotate" values="0 0 150;-360 0 150" dur="24s" begin="-8s" repeatCount="indefinite"/>
      <circle cx="0" cy="150" r="20" fill="#1a1a1a" stroke="#3d3d3d" stroke-width="1"/>
      <image href="https://cdn.simpleicons.org/javascript/8a9a7e" x="-13" y="137" width="26" height="26"/>
    </g>
  </g>

  <!-- TensorFlow -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 190 190;360 190 190" dur="24s" begin="-12s" repeatCount="indefinite"/>
    <g transform="translate(190,40)">
      <animateTransform attributeName="transform" type="rotate" values="0 0 150;-360 0 150" dur="24s" begin="-12s" repeatCount="indefinite"/>
      <circle cx="0" cy="150" r="20" fill="#1a1a1a" stroke="#3d3d3d" stroke-width="1"/>
      <image href="https://cdn.simpleicons.org/tensorflow/8a9a7e" x="-13" y="137" width="26" height="26"/>
    </g>
  </g>

  <!-- PyTorch -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 190 190;360 190 190" dur="24s" begin="-16s" repeatCount="indefinite"/>
    <g transform="translate(190,40)">
      <animateTransform attributeName="transform" type="rotate" values="0 0 150;-360 0 150" dur="24s" begin="-16s" repeatCount="indefinite"/>
      <circle cx="0" cy="150" r="20" fill="#1a1a1a" stroke="#3d3d3d" stroke-width="1"/>
      <image href="https://cdn.simpleicons.org/pytorch/8a9a7e" x="-13" y="137" width="26" height="26"/>
    </g>
  </g>

  <!-- Git -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 190 190;360 190 190" dur="24s" begin="-20s" repeatCount="indefinite"/>
    <g transform="translate(190,40)">
      <animateTransform attributeName="transform" type="rotate" values="0 0 150;-360 0 150" dur="24s" begin="-20s" repeatCount="indefinite"/>
      <circle cx="0" cy="150" r="20" fill="#1a1a1a" stroke="#3d3d3d" stroke-width="1"/>
      <image href="https://cdn.simpleicons.org/git/8a9a7e" x="-13" y="137" width="26" height="26"/>
    </g>
  </g>

</svg>
